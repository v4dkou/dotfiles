input * {
        tap enabled
}
default_border pixel 1
default_floating_border normal
hide_edge_borders smart

set $mod Mod4
input type:keyboard {
  xkb_layout "us,ru"
  xkb_options "grp:alt_shift_toggle,grp:ctrl_space_toggle,caps:super"
}

bindsym --border button2 kill
# Match browser tab controls: wheel over the tab strip selects a sibling.
bindsym --border button4 focus prev
bindsym --border button5 focus next

# Capture the currently active output to clipboard
bindsym Shift+Print exec grimshot copy output

# Capture the currently active window to clipboard
bindsym Shift+Alt+Print exec grimshot copy active

# Select and capture a custom rectangular area to clipboard
bindsym Shift+Ctrl+Print exec grimshot copy area

bindsym $mod+Shift+Print exec wf-recorder -f ~/Videos/recording_$(date +%Y-%m-%d_%H-%M-%S).mp4
bindsym $mod+Shift+Alt+Print exec wf-recorder -g "$(slurp)" -f ~/Videos/recording_$(date +%Y-%m-%d_%H-%M-%S).mp4
bindsym $mod+Shift+F9 exec pkill -INT wf-recorder

bindsym $mod+F12 exec swaylock # loginctl lock-session
bindsym $mod+F11 exec cmus-remote --pause
bindsym $mod+KP_Add exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym $mod+KP_Subtract exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym $mod+Shift+F10 sticky toggle

output * bg #000000 solid_color
#client.focused          #121212 #121212 #ffffff #121212 #121212
client.unfocused        #121212 #121212 #888888 #121212 #121212
#client.focused_inactive #121212 #121212 #aaaaaa #121212 #121212
#client.urgent           #ff0000 #ff0000 #ffffff #ff0000 #ff0000

exec_always {
    # Environment exports belong in the login shell/environment.d, before Sway
    # starts. Child shells here cannot change Sway's environment.
    gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
    gsettings set org.gnome.desktop.interface color-scheme prefer-dark
}
